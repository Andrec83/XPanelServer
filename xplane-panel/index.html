<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Plane Panel Manager</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/icon-180.png">
<meta name="theme-color" content="#111111">
<script type="importmap">
{
  "imports": {
    "interactjs": "https://cdn.jsdelivr.net/npm/interactjs/dist/interact.esm.js"
  }
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, sans-serif;
  background: #0d0d0d;
  color: #ddd;
  min-height: 100vh;
}

/* ── nav ── */
nav {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .75rem 1.5rem;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
}
nav h1 { font-size: 1rem; font-weight: 600; color: #4af; letter-spacing: .05em; }
nav .spacer { flex: 1; }
nav button {
  background: none;
  border: 1px solid #444;
  color: #aaa;
  padding: .35rem .85rem;
  border-radius: 4px;
  cursor: pointer;
  font-size: .85rem;
}
nav button:hover { border-color: #4af; color: #4af; }
nav button.active { border-color: #4af; color: #4af; background: #4af1; }
#xp-badge {
  font-size: .75rem; padding: .2rem .6rem; border-radius: 10px; border: 1px solid;
  transition: color .3s, border-color .3s, background .3s;
}
#xp-badge.ok  { color: #4f8; border-color: #4f84; background: #4f81; }
#xp-badge.err { color: #f64; border-color: #f644; background: #f641; }
#xp-badge.info { color: #aaa; border-color: #4444; background: none; }

/* ── views ── */
.view { display: none; padding: 1.5rem; }
#view-home, #view-settings { max-width: 1100px; }
.view.active { display: block; }

/* ── home view ── */
.panel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin-top: 1rem; }
.panel-card {
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 6px;
  padding: 1rem;
}
.panel-card h3 { font-size: .95rem; margin-bottom: .4rem; }
.panel-card .meta { font-size: .75rem; color: #666; margin-bottom: .8rem; }
.panel-card .actions { display: flex; gap: .5rem; }
.panel-card .actions button {
  flex: 1;
  padding: .35rem;
  border: 1px solid #333;
  background: #222;
  color: #bbb;
  border-radius: 4px;
  cursor: pointer;
  font-size: .8rem;
}
.panel-card .actions button:hover { border-color: #4af; color: #4af; }
.panel-card .actions button.open { background: #4af2; border-color: #4af; color: #4af; }
.panel-card .actions button.del:hover { border-color: #f44; color: #f44; }
.empty-state { color: #555; font-size: .9rem; margin-top: 2rem; }

.btn-primary {
  display: inline-flex; align-items: center; gap: .4rem;
  background: #4af2; border: 1px solid #4af; color: #4af;
  padding: .45rem 1rem; border-radius: 4px; cursor: pointer; font-size: .9rem;
}
.btn-primary:hover { background: #4af3; }

/* ── editor view ── */
.editor-layout {
  display: grid;
  grid-template-columns: 180px 1fr 220px;
  grid-template-rows: auto 1fr;
  gap: 1rem;
  height: calc(100vh - 120px);
}
.editor-topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: .75rem;
  background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: .75rem 1rem;
}
.editor-topbar input[type=text] {
  background: #111; border: 1px solid #444; color: #ddd;
  padding: .4rem .6rem; border-radius: 4px; font-size: .9rem; width: 220px;
}
.editor-topbar input[type=text]:focus { outline: none; border-color: #4af; }
.editor-topbar label { font-size: .8rem; color: #888; }
.editor-topbar select {
  background: #111; border: 1px solid #444; color: #ddd;
  padding: .35rem .5rem; border-radius: 4px; font-size: .85rem;
}
.editor-topbar .spacer { flex: 1; }

/* palette */
.palette {
  background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
  padding: .75rem; overflow-y: auto;
}
.palette h4 { font-size: .75rem; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .6rem; }
.palette-item {
  display: flex; align-items: center; gap: .5rem;
  padding: .5rem .6rem; border: 1px solid #333; border-radius: 4px;
  margin-bottom: .4rem; cursor: grab; background: #111; font-size: .82rem; color: #ccc;
  user-select: none;
}
.palette-item:hover { border-color: #4af; color: #4af; }
.palette-item .icon { font-size: 1rem; width: 1.2rem; text-align: center; flex-shrink: 0; }
.palette-section { margin-bottom: .5rem; }
.palette-section > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: .4rem;
  font-size: .72rem; color: #888; text-transform: uppercase; letter-spacing: .06em;
  padding: .35rem .2rem; border-bottom: 1px solid #2a2a2a; margin-bottom: .4rem;
}
.palette-section > summary::-webkit-details-marker { display: none; }
.palette-section > summary::before { content: '▸'; color: #555; transition: transform .15s; }
.palette-section[open] > summary::before { transform: rotate(90deg); }
.palette-section > summary:hover { color: #4af; }
.palette-section .count { margin-left: auto; color: #555; }
.palette-msg { font-size: .75rem; color: #666; margin: .25rem 0 .5rem; }
.palette-msg.err { color: #f64; }
.editor-topbar .toggle { display: flex; align-items: center; gap: .35rem; cursor: pointer; white-space: nowrap; }
.field-row .check-row { display: flex; align-items: center; gap: .4rem; font-size: .8rem; color: #bbb; margin-bottom: .2rem; }
.field-row .check-row input { width: auto; }
.widget-tile.missing { background: #2a1a10; }
.widget-tile.missing .wlabel { color: #f90; }

/* ── dataref availability (checked against the live X-Plane dataref list) ── */
.widget-tile.dr-broken { background: #3a1214; box-shadow: inset 0 0 0 2px #e33; }
.widget-tile.dr-broken.selected { background: #4a1a20; box-shadow: inset 0 0 0 2px #f66; }
.widget-tile.dr-broken .wlabel { color: #f88; }
.widget-tile .wbadge {
  position: absolute; top: 3px; left: 5px; font-size: .7rem; font-weight: 700;
  color: #fff; background: #e33; border-radius: 8px; padding: 0 .35rem; line-height: 1.25rem;
}
.palette-item.dr-broken { border-color: #6a2226; color: #e99; }
.palette-item.dr-broken::after { content: '●'; margin-left: auto; color: #e33; font-size: .7rem; }
.palette-item.dr-broken:hover { border-color: #f66; color: #faa; }
.field-row.dr-missing .dr-ac-wrap input { border-color: #e33; box-shadow: 0 0 0 1px #e33; }
.field-row.dr-optional .dr-ac-wrap input { border-color: #c80; }
.field-row .dr-note { font-size: .68rem; margin-top: .2rem; color: #f77; }
details.dr-many > summary { cursor: pointer; font-size: .75rem; color: #888; margin-bottom: .5rem; user-select: none; }
details.dr-many > summary:hover { color: #4af; }
.field-row .opt-help { font-size: .68rem; margin-top: .25rem; color: #666; line-height: 1.35; }
.field-row.dr-optional .dr-note { color: #ca6; }
.dr-summary {
  font-size: .75rem; line-height: 1.35; color: #fbb; background: #3a1214;
  border: 1px solid #e33; border-radius: 4px; padding: .45rem .55rem; margin-bottom: .75rem;
}
.dr-summary b { color: #fff; }
.dr-summary a { color: inherit; text-decoration: underline; white-space: nowrap; margin-left: .2rem; }
.dr-summary a:hover { color: #fff; }
.dr-summary.ok   { color: #8d8; background: #12301a; border-color: #2a6a3a; }
.dr-summary.info { color: #999; background: #1a1a1a; border-color: #333; }
#dr-tip {
  position: fixed; z-index: 2000; display: none; pointer-events: none;
  max-width: 340px; background: #1c0d0e; border: 1px solid #e33; border-radius: 5px;
  padding: .5rem .65rem; font-size: .75rem; line-height: 1.4; color: #eee;
  box-shadow: 0 6px 18px #000a;
}
#dr-tip b { color: #f88; }
#dr-tip code { font-family: monospace; font-size: .7rem; color: #fcc; word-break: break-all; }
#dr-tip .more { color: #888; }

/* grid area */
.editor-canvas {
  background: #111; border: 1px solid #333; border-radius: 6px;
  overflow: auto;
  padding: 1rem;
}
.grid-preview {
  display: grid;
  gap: 4px;
  width: 100%;
}
.grid-cell {
  background: #1a1a1a;
  border: 1px dashed #333;
  border-radius: 4px;
  min-height: 80px;
  min-width: 80px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.grid-cell.drag-over { border-color: #4af; background: #4af1; }
.grid-cell.occupied { border-style: solid; border-color: #555; }

.widget-tile {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .25rem; cursor: pointer; border-radius: 3px;
  background: #222;
}
.widget-tile .wicon { font-size: 1.4rem; }
.widget-tile .wlabel { font-size: .7rem; color: #aaa; text-transform: uppercase; letter-spacing: .06em; }
.widget-tile .wremove {
  position: absolute; top: 3px; right: 4px;
  background: none; border: none; color: #555; cursor: pointer; font-size: .8rem; line-height: 1;
}
.widget-tile .wremove:hover { color: #f44; }
.widget-tile.selected { background: #4af2; }

/* right sidebar */
.sidebar-right {
  background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
  padding: .75rem; overflow-y: auto;
}
.sidebar-right h4 { font-size: .75rem; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .75rem; }
.sidebar-right .empty-msg { font-size: .8rem; color: #444; }
.field-row { margin-bottom: .65rem; }
.field-row label { display: block; font-size: .75rem; color: #888; margin-bottom: .2rem; }
.field-row input, .field-row select {
  width: 100%; background: #111; border: 1px solid #444; color: #ddd;
  padding: .35rem .5rem; border-radius: 4px; font-size: .82rem;
}
.field-row input:focus, .field-row select:focus { outline: none; border-color: #4af; }

/* ── settings view ── */
.settings-section {
  background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
  padding: 1.25rem; margin-bottom: 1.25rem; max-width: 540px;
}
.settings-section h3 { font-size: .9rem; margin-bottom: 1rem; color: #bbb; }
.settings-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
.settings-row label { font-size: .85rem; color: #888; min-width: 90px; }
.settings-row input {
  flex: 1; background: #111; border: 1px solid #444; color: #ddd;
  padding: .4rem .6rem; border-radius: 4px; font-size: .9rem;
}
.settings-row input:focus { outline: none; border-color: #4af; }
.settings-row button {
  padding: .4rem .9rem; background: #222; border: 1px solid #444;
  color: #bbb; border-radius: 4px; cursor: pointer; font-size: .85rem;
}
.settings-row button:hover { border-color: #4af; color: #4af; }
.status-msg { font-size: .82rem; margin-top: .5rem; min-height: 1.2em; }
.status-msg.ok { color: #4f8; }
.status-msg.err { color: #f64; }
.status-msg.info { color: #aaa; }

/* ── engine-select modal ── */
.eng-modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.78); z-index: 1000;
  align-items: center; justify-content: center;
}
.eng-modal-overlay.visible { display: flex; }
.eng-modal {
  background: #1a1a1a; border: 1px solid #555; border-radius: 8px;
  padding: 1.5rem; width: 280px;
}
.eng-modal h3 { font-size: .95rem; color: #ddd; margin-bottom: .3rem; }
.eng-modal p  { font-size: .8rem;  color: #666; margin-bottom: 1rem; }
.eng-modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .75rem; }
.eng-btn {
  padding: .6rem; background: #222; border: 1px solid #444;
  color: #bbb; border-radius: 4px; cursor: pointer; font-size: .9rem; font-weight: 600;
}
.eng-btn:hover { border-color: #4af; color: #4af; }
.eng-btn-cancel { width: 100%; padding: .4rem; background: #111; border: 1px solid #333; color: #555; border-radius: 4px; cursor: pointer; font-size: .82rem; }
.eng-btn-cancel:hover { color: #888; border-color: #444; }

.search-input {
  width: 100%; background: #111; border: 1px solid #444; color: #ddd;
  padding: .4rem .6rem; border-radius: 4px; font-size: .85rem; margin-bottom: .75rem;
}
.search-input:focus { outline: none; border-color: #4af; }
.search-results { max-height: 320px; overflow-y: auto; }
.dr-row {
  padding: .4rem .5rem; border-bottom: 1px solid #222; font-size: .78rem;
}
.dr-row:last-child { border-bottom: none; }
.dr-name { color: #ddd; font-family: monospace; }
.dr-meta { color: #666; margin-top: .1rem; }
.dr-meta .tag {
  display: inline-block; margin-right: .4rem;
  padding: .05rem .3rem; border-radius: 2px; font-size: .7rem;
}
.tag.w  { background: #1a3a1a; color: #4f8; }
.tag.ro { background: #2a1a1a; color: #f64; }
.tag.unit { background: #1a1a2a; color: #88f; }

/* ── dataref autocomplete (sidebar) ── */
.dr-ac-wrap { position: relative; }
.dr-ac-wrap input { width: 100%; background: #111; border: 1px solid #444; color: #ddd; padding: .35rem .5rem; border-radius: 4px; font-size: .82rem; }
.dr-ac-wrap input:focus { outline: none; border-color: #4af; }
.dr-ac-drop {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 500;
  background: #1a1a1a; border: 1px solid #555; border-top: none;
  border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto;
  box-shadow: 0 4px 12px #0008;
}
.dr-ac-opt { padding: .3rem .5rem; cursor: pointer; border-bottom: 1px solid #111; }
.dr-ac-opt:last-child { border-bottom: none; }
.dr-ac-opt:hover, .dr-ac-opt.ac-hi { background: #4af2; }
.dr-ac-name { color: #ddd; font-family: monospace; font-size: .75rem; }
.dr-ac-w { color: #4f8; font-size: .65rem; margin-left: .3rem; }
.dr-ac-meta { color: #666; font-size: .68rem; margin-top: .1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<nav>
  <h1>X-Plane Panels</h1>
  <div class="spacer"></div>
  <span id="xp-badge" class="info">X-Plane —</span>
  <button id="nav-home" class="active" onclick="showView('home')">Panels</button>
  <button id="nav-settings" onclick="showView('settings')">Settings</button>
</nav>

<!-- HOME VIEW -->
<div id="view-home" class="view active">
  <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
    <h2 style="font-size:1.1rem;color:#aaa;">Saved Panels</h2>
    <button class="btn-primary" onclick="newPanel()">+ New Panel</button>
  </div>
  <div id="panel-list" class="panel-list"></div>
</div>

<!-- EDITOR VIEW -->
<div id="view-editor" class="view">
  <div class="editor-layout">
    <div class="editor-topbar">
      <label>Name</label>
      <input type="text" id="edit-name" placeholder="Panel name" />
      <label>Cols</label>
      <select id="edit-cols">
        <option>1</option><option>2</option><option>3</option>
        <option selected>4</option><option>5</option><option>6</option>
      </select>
      <label>Rows</label>
      <select id="edit-rows">
        <option>1</option><option>2</option><option selected>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select>
      <label>BG</label>
      <input type="color" id="edit-bg" value="#111111" style="width:36px;height:28px;padding:2px;background:#111;border:1px solid #444;border-radius:4px;cursor:pointer;">
      <label class="toggle" title="Show on-screen buttons on instruments that support them. Individual widgets can override this in the sidebar.">
        <input type="checkbox" id="edit-controls" checked /> Touch controls
      </label>
      <div class="spacer"></div>
      <button onclick="saveCurrentPanel()" style="background:#4af2;border:1px solid #4af;color:#4af;padding:.4rem .9rem;border-radius:4px;cursor:pointer;font-size:.85rem;">Save</button>
      <button onclick="showView('home')" style="padding:.4rem .9rem;background:#222;border:1px solid #444;color:#bbb;border-radius:4px;cursor:pointer;font-size:.85rem;">Back</button>
    </div>

    <!-- left: palette — built from js/instruments/ at runtime (see js/instrument-registry.js) -->
    <div class="palette">
      <h4>Instruments</h4>
      <div id="palette-sections"><p class="palette-msg">Loading instruments…</p></div>
    </div>

    <!-- centre: grid -->
    <div class="editor-canvas">
      <div id="grid-preview" class="grid-preview"></div>
    </div>

    <!-- right: config sidebar -->
    <div class="sidebar-right" id="sidebar-right">
      <h4>Widget Config</h4>
      <p class="empty-msg">Click a widget to configure it.</p>
    </div>
  </div>
</div>

<!-- SETTINGS VIEW -->
<div id="view-settings" class="view">
  <div class="settings-section">
    <h3>X-Plane Connection</h3>
    <div class="settings-row">
      <label>Host</label>
      <input type="text" id="xp-host" value="localhost" placeholder="localhost or 192.168.x.x" />
      <button onclick="testConnection()">Test</button>
    </div>
    <div class="status-msg info" id="conn-status">Enter host and click Test.</div>
  </div>

  <div class="settings-section">
    <h3>DataRefs.txt</h3>
    <div class="settings-row" style="gap:.5rem;">
      <button onclick="loadRegistry()">Load / Refresh</button>
      <span id="registry-status" style="font-size:.82rem;color:#666;">Loading…</span>
    </div>
    <input class="search-input" id="dr-search" placeholder="Search DataRefs…" oninput="searchDatarefs(this.value)" />
    <div class="search-results" id="dr-results"></div>
  </div>
</div>

<!-- Engine-select modal -->
<div id="eng-modal" class="eng-modal-overlay">
  <div class="eng-modal">
    <h3 id="eng-modal-title">Select Engine</h3>
    <p id="eng-modal-msg">Which engine should this instrument monitor?</p>
    <div class="eng-modal-grid" id="eng-modal-btns"></div>
    <button class="eng-btn-cancel" id="eng-modal-cancel">Cancel — don't add</button>
  </div>
</div>

<script type="module">
import * as api from './js/xplane-api.js'
import * as registry from './js/dataref-registry.js'
import { listPanels, getPanel, savePanel, deletePanel, createPanel } from './js/panel-store.js'
import { loadInstruments } from './js/instrument-registry.js'

// ── globals ──────────────────────────────────────────────────────────────────
let _editingPanel = null   // panel object being edited
let _dragType = null       // instrument type being dragged from palette
let _selectedWidgetId = null
let _regReady = false      // community registry loaded
let _xpDatarefs = []       // live datarefs from X-Plane [{name, is_writable}]
let _instruments = null    // { byType, sections, errors } from instrument-registry.js

// Everything about an instrument type (label, icon, datarefs, options…) comes from the
// META export of its file in js/instruments/ — nothing is registered in this page.
const instr     = type => _instruments?.byType.get(type)
const selectOf  = type => instr(type)?.meta.select     // 'engine' | 'nav' | undefined
const labelOf   = type => instr(type)?.label || type

// ── dataref availability ─────────────────────────────────────────────────────
// Every instrument's datarefs (META.datarefs + the widget's overrides) are checked
// against the list X-Plane publishes right now, so an instrument that needs a
// particular aircraft/add-on shows red instead of silently drawing nothing.
// Instruments tune the check through META (no per-instrument code here):
//   requires:         'King Air 350 add-on'   human hint shown in the message
//   optionalDatarefs: ['key', …]              may be missing without breaking it
//   datarefCheck:     'any'                   works if at least one dataref exists
let _liveNames = null        // Set of names X-Plane publishes; null = not checked / offline
let _liveFetchedAt = 0

function drStatus(type, overrides = {}) {
  const meta = instr(type)?.meta
  if (!meta || !_liveNames) return null
  const optional = new Set(meta.optionalDatarefs || [])
  const anyMode  = meta.datarefCheck === 'any'
  const keys = {}              // key → 'ok' | 'missing' | 'optional'
  const missing = []
  let required = 0, requiredMissing = 0
  for (const [key, name] of Object.entries({ ...(meta.datarefs || {}), ...overrides })) {
    const opt = optional.has(key)
    if (!opt) required++
    if (name && _liveNames.has(name)) { keys[key] = 'ok'; continue }
    keys[key] = (opt || anyMode) ? 'optional' : 'missing'
    missing.push({ key, name, optional: opt })
    if (!opt) requiredMissing++
  }
  const broken = anyMode ? (required > 0 && requiredMissing === required) : requiredMissing > 0
  return { broken, keys, missing, required, requiredMissing, anyMode, requires: meta.requires }
}

// compact = sidebar version: the missing fields are outlined right below, so no list
function drMessage(st, label, compact = false) {
  if (!st?.broken) return ''
  const req = st.missing.filter(m => !m.optional)
  let html = st.anyMode
    ? `<b>${esc(label)}: no data</b> — none of its ${st.required} datarefs exist in X-Plane right now.`
    : compact
    ? `<b>Won't work</b> — ${req.length} of ${st.required} datarefs not found in X-Plane (outlined in red below).`
    : `<b>${esc(label)}: won't work</b> — ${req.length} of ${st.required} datarefs not found in X-Plane:<br>` +
      req.slice(0, 8).map(m => `<code>${esc(m.name)}</code>`).join('<br>') +
      (req.length > 8 ? `<br><span class="more">…and ${req.length - 8} more</span>` : '')
  html += st.requires
    ? `<br><br>Needs: ${esc(st.requires)}`
    : '<br><br>Probably needs a specific aircraft or add-on, or the dataref was renamed — point the fields marked red to existing datarefs.'
  return html
}

async function refreshLiveDatarefs(force = false) {
  if (!force && Date.now() - _liveFetchedAt < 5000) return
  _liveFetchedAt = Date.now()
  try {
    const ctrl = new AbortController()
    const t = setTimeout(() => ctrl.abort(), 8000)
    const res = await fetch('/api/v3/datarefs?limit=100000', { signal: ctrl.signal })
    clearTimeout(t)
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const data = (await res.json()).data || []
    _xpDatarefs = data
    _liveNames  = new Set(data.map(d => d.name))
  } catch {
    _liveNames = null          // offline → nothing is marked, rather than everything
  }
  _applyDrStatus()
}

const _selectedWidget = () => _editingPanel?.widgets.find(w => w.id === _selectedWidgetId)

function _applyDrStatus() {
  document.querySelectorAll('#palette-sections .palette-item').forEach(el => {
    const broken = !!drStatus(el.dataset.type)?.broken
    el.classList.toggle('dr-broken', broken)
    el.title = broken ? '' : (el.dataset.path || '')
  })
  if (_editingPanel && document.getElementById('view-editor')?.classList.contains('active')) renderGrid()
  const w = _selectedWidget()
  if (w) _markDrInputs(w)
}

// Sidebar: summary box + red/amber outline on each dataref field
function _markDrInputs(widget) {
  const st  = drStatus(widget.type, widget.datarefs)
  const sum = document.getElementById('dr-summary')
  if (sum) {
    const recheck = ' <a href="#" data-recheck>Recheck</a>'
    if (!instr(widget.type))   { sum.style.display = 'none' }
    else if (!st)              { sum.className = 'dr-summary info'; sum.innerHTML = 'X-Plane not reachable — datarefs not checked.' + recheck }
    else if (st.broken)        { sum.className = 'dr-summary';      sum.innerHTML = drMessage(st, labelOf(widget.type), true) + recheck }
    else if (st.missing.length){ sum.className = 'dr-summary info'; sum.innerHTML = `Works — ${st.missing.length} optional dataref(s) not found.` + recheck }
    else                       { sum.className = 'dr-summary ok';   sum.innerHTML = `All ${st.required} datarefs found in X-Plane.` + recheck }
  }
  document.querySelectorAll('#dr-fields .field-row[data-dr-key]').forEach(row => {
    const s = st?.keys[row.dataset.drKey]
    row.classList.toggle('dr-missing',  s === 'missing')
    row.classList.toggle('dr-optional', s === 'optional')
    const text = s === 'missing' ? 'Not found in X-Plane' : s === 'optional' ? 'Not found (optional)' : ''
    let note = row.querySelector('.dr-note')
    if (!text) { note?.remove(); return }
    if (!note) { note = document.createElement('div'); note.className = 'dr-note'; row.appendChild(note) }
    note.textContent = text
  })
  const many = document.querySelector('#dr-fields details.dr-many')
  if (many && document.querySelector('#dr-fields .dr-missing')) many.open = true
}

// Floating hover message (fixed-position so the scrolling grid can't clip it)
const _tip = document.createElement('div')
_tip.id = 'dr-tip'
document.body.appendChild(_tip)
function _moveTip(e) {
  const pad = 14, r = _tip.getBoundingClientRect()
  let x = e.clientX + pad, y = e.clientY + pad
  if (x + r.width  > innerWidth  - 8) x = Math.max(8, e.clientX - r.width - pad)
  if (y + r.height > innerHeight - 8) y = Math.max(8, e.clientY - r.height - pad)
  _tip.style.left = x + 'px'; _tip.style.top = y + 'px'
}
function _attachTip(el, htmlFn) {
  el.addEventListener('mouseenter', e => {
    const html = htmlFn()
    if (!html) return
    _tip.innerHTML = html; _tip.style.display = 'block'; _moveTip(e)
  })
  el.addEventListener('mousemove', e => { if (_tip.style.display === 'block') _moveTip(e) })
  el.addEventListener('mouseleave', () => { _tip.style.display = 'none' })
}

document.getElementById('edit-cols').addEventListener('change', () => {
  if (!_editingPanel) return
  _editingPanel.columns = parseInt(document.getElementById('edit-cols').value, 10)
  // remove widgets that fall outside new dimensions
  _editingPanel.widgets = _editingPanel.widgets.filter(
    w => w.col <= _editingPanel.columns && w.row <= _editingPanel.rows)
  renderGrid()
})
document.getElementById('edit-rows').addEventListener('change', () => {
  if (!_editingPanel) return
  _editingPanel.rows = parseInt(document.getElementById('edit-rows').value, 10)
  _editingPanel.widgets = _editingPanel.widgets.filter(
    w => w.col <= _editingPanel.columns && w.row <= _editingPanel.rows)
  renderGrid()
})

function renderGrid() {
  const { columns, rows, widgets } = _editingPanel
  const preview = document.getElementById('grid-preview')
  const CELL_H = 90
  preview.style.gridTemplateColumns = `repeat(${columns}, 1fr)`
  preview.style.gridTemplateRows    = `repeat(${rows}, ${CELL_H}px)`
  preview.innerHTML = ''
  _tip.style.display = 'none'           // the hovered tile is about to be replaced

  const occupied = new Map() // "col,row" → widgetId
  for (const w of widgets) {
    for (let c = w.col; c < w.col + (w.colSpan || 1); c++)
      for (let r = w.row; r < w.row + (w.rowSpan || 1); r++)
        occupied.set(`${c},${r}`, w.id)
  }

  for (let r = 1; r <= rows; r++) {
    for (let c = 1; c <= columns; c++) {
      const key = `${c},${r}`
      if (occupied.has(key)) {
        const orig = widgets.find(w => w.id === occupied.get(key))
        if (!orig || orig.col !== c || orig.row !== r) continue
      }

      const cell = document.createElement('div')
      cell.className = 'grid-cell'
      cell.dataset.col = c
      cell.dataset.row = r
      cell.style.gridColumn = c
      cell.style.gridRow = r

      const widget = widgets.find(w => w.col === c && w.row === r)
      if (widget) {
        cell.classList.add('occupied')
        if (widget.colSpan > 1) cell.style.gridColumnEnd = `span ${widget.colSpan}`
        if (widget.rowSpan > 1) cell.style.gridRowEnd    = `span ${widget.rowSpan}`
        const tile = document.createElement('div')
        const known = !!instr(widget.type)
        const broken = known && !!drStatus(widget.type, widget.datarefs)?.broken
        tile.className = 'widget-tile' + (widget.id === _selectedWidgetId ? ' selected' : '') +
                         (known ? '' : ' missing') + (broken ? ' dr-broken' : '')
        tile.title = known ? '' : `No instrument file defines type "${widget.type}"`
        tile.innerHTML = `
          ${broken ? '<span class="wbadge">!</span>' : ''}
          <span class="wicon">${esc(known ? instr(widget.type).icon : '?')}</span>
          <span class="wlabel">${esc(labelOf(widget.type))}</span>
          <button class="wremove" title="Remove">×</button>`
        if (known) _attachTip(tile, () => drMessage(drStatus(widget.type, widget.datarefs), labelOf(widget.type)))
        tile.querySelector('.wremove').addEventListener('click', e => {
          e.stopPropagation()
          _editingPanel.widgets = _editingPanel.widgets.filter(w => w.id !== widget.id)
          if (_selectedWidgetId === widget.id) _selectedWidgetId = null
          renderGrid()
          renderSidebar()
        })
        tile.addEventListener('click', () => {
          _selectedWidgetId = widget.id
          renderGrid()
          renderSidebar(widget)
        })
        cell.appendChild(tile)
      } else {
        // droppable empty cell
        cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over') })
        cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'))
        cell.addEventListener('drop', e => {
          e.preventDefault()
          cell.classList.remove('drag-over')
          const type = e.dataTransfer.getData('text/plain') || _dragType
          if (!type) return
          _addWidget(type, parseInt(cell.dataset.col, 10), parseInt(cell.dataset.row, 10))
        })
      }

      preview.appendChild(cell)
    }
  }
}


function _addWidget(type, col, row) {
  if (!instr(type)) return
  if (selectOf(type) === 'engine') {
    _showEngineModal(type, col, row)
  } else if (selectOf(type) === 'nav') {
    _showNavModal(type, col, row)
  } else {
    _createWidget(type, col, row, {})
  }
}

function _createWidget(type, col, row, config) {
  const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)
  _editingPanel.widgets.push({ id, type, col, row, colSpan: 1, rowSpan: 1, datarefs: {}, config })
  renderGrid()
}

const PALETTE_STATE_KEY = 'palette_sections_closed'

function _closedSections() {
  try { return new Set(JSON.parse(localStorage.getItem(PALETTE_STATE_KEY) || '[]')) } catch { return new Set() }
}

async function initPalette() {
  const root = document.getElementById('palette-sections')
  try {
    _instruments = await loadInstruments()
  } catch (err) {
    root.innerHTML = `<p class="palette-msg err">${esc(err.message)}</p>`
    return
  }
  const closed = _closedSections()
  root.innerHTML = _instruments.sections.map(sec => `
    <details class="palette-section" data-section="${esc(sec.name)}" ${closed.has(sec.name) ? '' : 'open'}>
      <summary>${esc(sec.name)}<span class="count">${sec.items.length}</span></summary>
      ${sec.items.map(it => `
        <div class="palette-item" draggable="true" data-type="${esc(it.type)}" data-path="${esc(it.path)}" title="${esc(it.path)}">
          <span class="icon">${esc(it.icon)}</span> ${esc(it.label)}
        </div>`).join('')}
    </details>`).join('')
    + (_instruments.errors.length
      ? `<p class="palette-msg err">${_instruments.errors.length} instrument file(s) failed to load:<br>` +
        _instruments.errors.map(e => `${esc(e.path)} — ${esc(e.message)}`).join('<br>') + '</p>'
      : '')

  root.querySelectorAll('.palette-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      _dragType = item.dataset.type
      e.dataTransfer.setData('text/plain', _dragType)
      e.dataTransfer.effectAllowed = 'copy'
      _tip.style.display = 'none'
    })
    _attachTip(item, () => drMessage(drStatus(item.dataset.type), labelOf(item.dataset.type)))
  })
  root.querySelectorAll('details.palette-section').forEach(d => {
    d.addEventListener('toggle', () => {
      const set = _closedSections()
      d.open ? set.delete(d.dataset.section) : set.add(d.dataset.section)
      try { localStorage.setItem(PALETTE_STATE_KEY, JSON.stringify([...set])) } catch {}
    })
  })
  _applyDrStatus()                  // red marks + refresh labels/icons if the editor was already open
}

// ── sidebar ──────────────────────────────────────────────────────────────────
function renderSidebar(widget) {
  const sb = document.getElementById('sidebar-right')
  if (!widget) {
    sb.innerHTML = '<h4>Widget Config</h4><p class="empty-msg">Click a widget to configure it.</p>'
    return
  }
  const entry = instr(widget.type)
  const meta  = entry?.meta || { datarefs: {}, options: [] }
  widget.config ||= {}
  widget.datarefs ||= {}

  // Options: built-in engine/NAV selector, touch-control override, then META.options
  const opts = []
  if (meta.select === 'engine') opts.push({ key: 'engineIndex', label: 'Engine', type: 'select', default: 0,
    choices: [0, 1, 2, 3].map(n => ({ value: n, label: `ENG ${n + 1}` })) })
  if (meta.select === 'nav') opts.push({ key: 'navIndex', label: 'NAV Radio', type: 'select', default: 0,
    choices: [0, 1].map(n => ({ value: n, label: `NAV ${n + 1}` })) })
  if (meta.touchControls) opts.push({ key: 'showControls', label: 'Touch controls', type: 'select', default: '',
    choices: [{ value: '', label: 'Panel default' }, { value: true, label: 'Show' }, { value: false, label: 'Hide' }] })
  opts.push(...(meta.options || []))
  const extraConfig = opts.map((o, i) => _optionField(o, i, widget.config)).join('')

  sb.innerHTML = `
    <h4>Widget Config</h4>
    <div class="field-row"><label>Type</label><span style="font-size:.82rem;color:#aaa;">${esc(labelOf(widget.type))}</span>
      <div style="font-size:.7rem;color:#555;font-family:monospace;">${esc(widget.type)}${entry ? ' · ' + esc(entry.section) : ' · not found'}</div></div>
    <div class="field-row">
      <label>Col Span</label>
      <input type="number" min="1" max="${_editingPanel.columns}" data-cfg="colSpan" value="${widget.colSpan||1}" />
    </div>
    <div class="field-row">
      <label>Row Span</label>
      <input type="number" min="1" max="${_editingPanel.rows}" data-cfg="rowSpan" value="${widget.rowSpan||1}" />
    </div>
    <h4 style="margin-top:.75rem;">DataRef Overrides</h4>
    <div id="dr-summary" class="dr-summary info"></div>
    <div id="dr-fields"></div>
    ${extraConfig ? '<h4 style="margin-top:.75rem;">Options</h4>' + extraConfig : ''}
  `

  let drContainer = document.getElementById('dr-fields')
  const drEntries = Object.entries(meta.datarefs || {})
  if (drEntries.length > 12) {        // long lists (e.g. FMS CDU) fold away; opened when one is missing
    const det = document.createElement('details')
    det.className = 'dr-many'
    det.innerHTML = `<summary>Show all ${drEntries.length} datarefs</summary>`
    drContainer.appendChild(det)
    drContainer = det
  }
  for (const [key, def] of drEntries)
    drContainer.appendChild(_createDrInput(key, widget, def))
  _markDrInputs(widget)

  sb.querySelectorAll('input[data-cfg]').forEach(inp => {
    inp.addEventListener('change', () => {
      widget[inp.dataset.cfg] = parseInt(inp.value, 10) || 1
      renderGrid()
    })
  })
  sb.querySelectorAll('[data-opt]').forEach(el => {
    el.addEventListener('change', () => {
      const o = opts[parseInt(el.dataset.opt, 10)]
      let val
      if (o.type === 'multi') {
        val = [...sb.querySelectorAll(`[data-opt="${el.dataset.opt}"]:checked`)].map(c => o._values[parseInt(c.dataset.choice, 10)])
      } else if (o.type === 'checkbox') {
        val = el.checked
      } else if (o.type === 'number') {
        val = el.value === '' ? '' : Number(el.value)
      } else if (o.type === 'select') {
        val = o._values[el.selectedIndex]
      } else {
        val = el.value
      }
      if (val === '' || val === undefined) delete widget.config[o.key]
      else widget.config[o.key] = val
    })
  })
}

// Renders one sidebar option from a META.options entry:
//   { key, label, type: 'select' | 'multi' | 'checkbox' | 'number' | 'text', default, choices, min, max, step,
//     placeholder, help }   // help = small explanatory text under the field
// choices: [value, …] or [{ value, label }, …]. Selecting a choice whose value is '' removes the key.
function _optionField(o, idx, config) {
  const choices = (o.choices || []).map(c => (c !== null && typeof c === 'object') ? c : { value: c, label: String(c) })
  o._values = choices.map(c => c.value)
  const cur = config[o.key] ?? o.default
  const label = `<label>${esc(o.label || o.key)}</label>`
  const help  = o.help ? `<div class="opt-help">${esc(o.help)}</div>` : ''
  if (o.type === 'select') {
    return `<div class="field-row">${label}<select data-opt="${idx}">
      ${choices.map(c => `<option${String(c.value) === String(cur ?? '') ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}
    </select>${help}</div>`
  }
  if (o.type === 'multi') {
    const active = Array.isArray(cur) ? cur.map(String) : []
    return `<div class="field-row">${label}${choices.map((c, ci) => `
      <label class="check-row"><input type="checkbox" data-opt="${idx}" data-choice="${ci}" ${active.includes(String(c.value)) ? 'checked' : ''}/> ${esc(c.label)}</label>`).join('')}${help}</div>`
  }
  if (o.type === 'checkbox') {
    return `<div class="field-row"><label class="check-row"><input type="checkbox" data-opt="${idx}" ${cur ? 'checked' : ''}/> ${esc(o.label || o.key)}</label>${help}</div>`
  }
  const attrs = o.type === 'number' ? ['min', 'max', 'step'].filter(a => o[a] != null).map(a => `${a}="${o[a]}"`).join(' ') : ''
  const ph    = o.placeholder != null ? ` placeholder="${esc(o.placeholder)}"` : ''
  return `<div class="field-row">${label}<input type="${o.type === 'number' ? 'number' : 'text'}" data-opt="${idx}" ${attrs}${ph} value="${esc(cur ?? '')}" />${help}</div>`
}

const hostInput = document.getElementById('xp-host')
hostInput.value = localStorage.getItem('xplane_host') ||  window.location.hostname //'localhost'
hostInput.addEventListener('change', () => localStorage.setItem('xplane_host', hostInput.value.trim()))

function _xpBase(host) {
  /* Use a relative URL when testing the server we were loaded from,
     absolute on the same port when testing a different host. */
  const same = (host === window.location.hostname || host === 'localhost')
  return same ? '' : `http://${host}:${window.location.port || 8088}`
}

async function testConnection(silent = false) {
  const host = hostInput.value.trim() || 'localhost'
  localStorage.setItem('xplane_host', host)
  const el   = document.getElementById('conn-status')
  const badge = document.getElementById('xp-badge')
  if (!silent) { el.className = 'status-msg info'; el.textContent = 'Connecting…' }
  badge.className = 'info'; badge.textContent = 'X-Plane —'
  try {
    const base = _xpBase(host)
    const res  = await fetch(`${base}/api/capabilities`)
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const json = await res.json()
    const ver  = json['x-plane']?.version ?? '?'
    el.className  = 'status-msg ok'
    el.textContent = `Connected to X-Plane ${ver}`
    badge.className = 'ok'; badge.textContent = `X-Plane ${ver}`

    /* Also refresh the live dataref list (autocomplete + availability marks) */
    if (base === '') {
      refreshLiveDatarefs()
    } else if (_xpDatarefs.length === 0) {
      fetch(`${base}/api/v3/datarefs?limit=100000`)
        .then(r => r.ok ? r.json() : null)
        .then(j => { if (j) _xpDatarefs = j.data || [] })
        .catch(() => {})
    }
  } catch (e) {
    el.className  = 'status-msg err'
    el.textContent = `Connection failed: ${e.message}`
    badge.className = 'err'; badge.textContent = 'X-Plane offline'
  }
}

  } catch (e) {
    el.textContent = `Failed: ${e.message}`
  }
}

async function _autoLoadDrSources() {
  // Community registry — has descriptions, units, writable flags
  registry.loadRegistry().then(r => {
    _regReady = true
    const el = document.getElementById('registry-status')
    if (el) el.textContent = `${r.count.toLocaleString()} entries loaded${r.fromCache ? ' (cached)' : ''}`
  }).catch(() => {})

  // Live X-Plane datarefs via plugin — no descriptions but always current.
  // Also drives the red "dataref not found" marks.
  await refreshLiveDatarefs(true)
}

function _searchDr(q, limit = 24) {
  if (!q || q.length < 2) return []
  const results = []
  const seen = new Set()
  if (_regReady) {
    for (const r of registry.search(q, limit)) {
      seen.add(r.name); results.push(r)
    }
  }
  if (results.length < limit && _xpDatarefs.length > 0) {
    const ql = q.toLowerCase()
    for (const dr of _xpDatarefs) {
      if (results.length >= limit) break
      if (!seen.has(dr.name) && dr.name.toLowerCase().includes(ql)) {
        results.push({ name: dr.name, writable: dr.is_writable, units: '', description: '' })
        seen.add(dr.name)
      }
    }
  }
  return results
}

function _createDrInput(key, widget, placeholder) {
  const wrap = document.createElement('div')
  wrap.className = 'field-row'
  wrap.dataset.drKey = key

  const label = document.createElement('label')
  label.textContent = key
  wrap.appendChild(label)

  const acWrap = document.createElement('div')
  acWrap.className = 'dr-ac-wrap'

  const inp = document.createElement('input')
  inp.type = 'text'
  inp.value = widget.datarefs[key] || ''
  inp.placeholder = placeholder || ''

  const drop = document.createElement('div')
  drop.className = 'dr-ac-drop'
  drop.style.display = 'none'

  let debTimer = null
  let hiIdx = -1

  function opts() { return [...drop.querySelectorAll('.dr-ac-opt')] }

  function showDrop(results) {
    if (!results.length) { drop.style.display = 'none'; return }
    drop.innerHTML = results.map(r => {
      const meta = [
        r.units       ? `<span style="color:#88f">${esc(r.units)}</span>` : '',
        r.description ? esc(r.description) : ''
      ].filter(Boolean).join(' · ')
      return `<div class="dr-ac-opt" data-name="${esc(r.name)}">
        <div class="dr-ac-name">${esc(r.name)}${r.writable ? '<span class="dr-ac-w">W</span>' : ''}</div>
        ${meta ? `<div class="dr-ac-meta">${meta}</div>` : ''}
      </div>`
    }).join('')
    drop.style.display = 'block'
    hiIdx = -1
    drop.querySelectorAll('.dr-ac-opt').forEach(opt =>
      opt.addEventListener('mousedown', e => { e.preventDefault(); commit(opt.dataset.name) })
    )
  }

  function commit(name) {
    inp.value = name
    if (name.trim()) widget.datarefs[key] = name.trim()
    else delete widget.datarefs[key]
    drop.style.display = 'none'
    revalidate()
  }

  function revalidate() {             // re-check this widget after an override changes
    _markDrInputs(widget)
    renderGrid()
  }

  inp.addEventListener('input', () => {
    clearTimeout(debTimer)
    debTimer = setTimeout(() => showDrop(_searchDr(inp.value.trim())), 150)
  })

  inp.addEventListener('keydown', e => {
    const list = opts()
    if (!list.length) return
    if (e.key === 'ArrowDown') {
      e.preventDefault()
      hiIdx = Math.min(hiIdx + 1, list.length - 1)
      list.forEach((o, i) => o.classList.toggle('ac-hi', i === hiIdx))
      list[hiIdx]?.scrollIntoView({ block: 'nearest' })
    } else if (e.key === 'ArrowUp') {
      e.preventDefault()
      hiIdx = Math.max(hiIdx - 1, 0)
      list.forEach((o, i) => o.classList.toggle('ac-hi', i === hiIdx))
      list[hiIdx]?.scrollIntoView({ block: 'nearest' })
    } else if (e.key === 'Enter' && hiIdx >= 0) {
      e.preventDefault(); commit(list[hiIdx].dataset.name)
    } else if (e.key === 'Escape') {
      drop.style.display = 'none'
    }
  })

  inp.addEventListener('change', () => {
    if (inp.value.trim()) widget.datarefs[key] = inp.value.trim()
    else delete widget.datarefs[key]
    revalidate()
  })

  inp.addEventListener('blur', () => setTimeout(() => { drop.style.display = 'none' }, 160))

  acWrap.appendChild(inp)
  acWrap.appendChild(drop)
  wrap.appendChild(acWrap)
  return wrap
}

function searchDatarefs(q) {
  if (!q.trim()) { document.getElementById('dr-results').innerHTML = ''; return }
  const results = registry.search(q, 40)
  document.getElementById('dr-results').innerHTML = results.map(r => `
    <div class="dr-row">
      <div class="dr-name">${esc(r.name)}</div>
      <div class="dr-meta">
        <span class="tag ${r.writable ? 'w' : 'ro'}">${r.writable ? 'W' : 'RO'}</span>
        ${r.units ? `<span class="tag unit">${esc(r.units)}</span>` : ''}
        ${r.description ? `<span style="color:#555;">${esc(r.description)}</span>` : ''}
      </div>
    </div>`).join('') || '<div style="padding:.5rem;color:#555;font-size:.8rem;">No results.</div>'
}

// ── helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// init
;(async () => {
  initPalette()
  await renderHome()
  testConnection(true)    // silent — updates nav badge, no spinner in Settings
  _autoLoadDrSources()
})()
</script>
